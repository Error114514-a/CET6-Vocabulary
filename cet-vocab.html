<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>四六级刷词</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --bg:#0A0E14;
      --panel:rgba(17,24,33,0.92);
      --panel-solid:#111821;
      --primary:#00E5FF;
      --primary-dim:#008B94;
      --primary-glow:rgba(0,229,255,0.25);
      --accent:#FFB83D;
      --accent-glow:rgba(255,184,61,0.25);
      --danger:#FF4757;
      --text:#E0E6ED;
      --text-sub:#8B98A8;
      --text-dim:#4A5568;
      --border:rgba(0,229,255,0.12);
      --border-active:rgba(0,229,255,0.4);
      --cut:14px;
    }
    body {
      font-family:"SF Mono","JetBrains Mono","Consolas","Source Code Pro","PingFang SC","Microsoft YaHei",monospace;
      background:var(--bg); color:var(--text); line-height:1.6;
      position:relative;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        linear-gradient(rgba(0,229,255,0.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,255,0.015) 1px,transparent 1px);
      background-size:24px 24px;
    }
    #app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1; }
    .page { display:none; animation:fadeIn 0.35s ease; }
    .page.active { display:block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
    @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

    /* ===== 板块选择页 ===== */
    .module-select { padding:48px 20px 32px; }
    .module-header { text-align:left; margin-bottom:36px; position:relative; padding-left:14px; }
    .module-header::before { content:''; position:absolute; left:0; top:4px; bottom:4px; width:3px; background:var(--primary); box-shadow:0 0 8px var(--primary-glow); }
    .module-header h1 { font-size:22px; font-weight:400; color:var(--text); margin-bottom:6px; letter-spacing:0.15em; text-transform:uppercase; }
    .module-header p { font-size:12px; color:var(--text-dim); letter-spacing:0.1em; }
    .module-cards { display:flex; flex-direction:column; gap:14px; }
    .module-card {
      background:var(--panel); border:1px solid var(--border);
      clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);
      padding:24px 20px; cursor:pointer; transition:all 0.25s ease; position:relative; overflow:hidden;
    }
    .module-card::after {
      content:''; position:absolute; top:0; right:0; width:var(--cut); height:var(--cut);
      background:linear-gradient(135deg,transparent 50%,var(--border-active) 50%);
    }
    .module-card:active { transform:scale(0.985); border-color:var(--border-active); }
    .module-card.selected { border-color:var(--primary); box-shadow:0 0 20px var(--primary-glow), inset 0 0 20px rgba(0,229,255,0.03); }
    .module-card.disabled { opacity:0.35; cursor:not-allowed; }
    .module-icon { font-size:32px; margin-bottom:10px; }
    .module-card h3 { font-size:17px; font-weight:400; color:var(--text); margin-bottom:4px; letter-spacing:0.06em; }
    .module-card p { font-size:12px; color:var(--text-sub); margin-bottom:12px; letter-spacing:0.03em; }
    .module-meta { display:flex; justify-content:space-between; align-items:center; }
    .module-count { font-size:11px; color:var(--primary); font-weight:400; letter-spacing:0.08em; text-transform:uppercase; }
    .module-progress { font-size:11px; color:var(--text-dim); letter-spacing:0.08em; }

    /* ===== 顶部栏 ===== */
    .top-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--panel-solid); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
    .top-bar::after { content:''; position:absolute; bottom:-1px; left:0; width:60px; height:1px; background:var(--primary); box-shadow:0 0 6px var(--primary-glow); }
    .back-btn { border:none; background:none; font-size:22px; color:var(--primary); cursor:pointer; padding:4px 8px; font-weight:300; }
    .logo { font-size:14px; font-weight:400; color:var(--text); letter-spacing:0.1em; text-transform:uppercase; }
    .top-right { display:flex; align-items:center; gap:10px; }
    .streak-info { font-size:11px; background:transparent; color:var(--primary); padding:3px 10px; border:1px solid var(--border-active); letter-spacing:0.08em; clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%); }

    /* ===== 主内容区 ===== */
    .main-content { flex:1; padding:20px 16px 100px; }

    /* ===== 开始页 ===== */
    .start-content { text-align:center; padding:72px 20px; position:relative; }
    .start-emoji { font-size:48px; margin-bottom:24px; color:var(--primary); animation:pulse 2s ease-in-out infinite; }
    .start-content h2 { font-size:20px; font-weight:400; margin-bottom:10px; letter-spacing:0.1em; }
    .start-content p { color:var(--text-sub); margin-bottom:32px; font-size:13px; letter-spacing:0.05em; }

    /* ===== 进度条 ===== */
    .progress-bar { width:100%; height:2px; background:rgba(0,229,255,0.08); overflow:hidden; margin-bottom:6px; position:relative; }
    .progress-fill { height:100%; background:var(--primary); box-shadow:0 0 6px var(--primary-glow); transition:width 0.4s ease; width:0%; }
    .progress-text { text-align:center; font-size:11px; color:var(--text-dim); margin-bottom:20px; letter-spacing:0.12em; }

    /* ===== 单词卡片 ===== */
    .word-card {
      background:var(--panel); border:1px solid var(--border);
      clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
      overflow:hidden; margin-bottom:24px; position:relative;
    }
    .word-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background:linear-gradient(90deg,transparent,var(--primary),transparent);
      z-index:2;
    }
    .card-image { height:170px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
    .card-image::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 60%,rgba(10,14,20,0.8)); pointer-events:none; }
    .card-emoji { font-size:60px; filter:drop-shadow(0 0 12px rgba(0,229,255,0.3)); z-index:1; }
    .card-body { padding:24px 20px; text-align:center; position:relative; }
    .word-spelling { font-size:26px; font-weight:400; color:var(--text); margin-bottom:4px; letter-spacing:0.04em; }
    .word-phonetic { font-size:13px; color:var(--text-dim); margin-bottom:8px; }
    .word-meaning { font-size:15px; color:var(--primary); font-weight:400; margin-bottom:18px; letter-spacing:0.03em; }
    .audio-btn { position:absolute; top:20px; right:20px; width:34px; height:34px; border:1px solid var(--border-active); background:transparent; color:var(--primary); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,0 100%); }
    .audio-btn:active { transform:scale(0.92); box-shadow:0 0 12px var(--primary-glow); }
    .example-box { background:rgba(0,229,255,0.03); padding:14px; text-align:left; border-left:2px solid var(--primary); position:relative; }
    .example-en { font-size:13px; color:var(--text); font-style:italic; margin-bottom:4px; }
    .example-cn { font-size:12px; color:var(--text-sub); }
    .audio-btn-small { margin-top:8px; border:none; background:none; color:var(--primary); font-size:11px; cursor:pointer; padding:4px 0; letter-spacing:0.08em; text-transform:uppercase; }

    /* ===== 操作按钮 ===== */
    .action-buttons { display:flex; gap:10px; }
    .btn { flex:1; padding:14px; border:none; font-size:15px; font-weight:400; cursor:pointer; transition:all 0.2s; letter-spacing:0.08em; text-transform:uppercase; }
    .btn:active { transform:scale(0.97); }
    .btn-primary { background:var(--primary); color:var(--bg); width:100%; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%); }
    .btn-large { padding:15px 44px; font-size:16px; flex:none; width:auto; }
    .btn-skip { background:transparent; color:var(--text-sub); border:1px solid var(--border); clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%); }
    .btn-mastered { background:var(--accent); color:var(--bg); clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%); box-shadow:0 0 12px var(--accent-glow); }
    .btn-reset { background:var(--primary); color:var(--bg); padding:13px 36px; font-size:14px; margin-top:20px; flex:none; width:auto; clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%); }

    /* ===== 完成页 ===== */
    .done-content { text-align:center; padding:60px 20px; }
    .done-emoji { font-size:48px; margin-bottom:20px; color:var(--primary); }
    .done-content h2 { font-size:20px; font-weight:400; margin-bottom:10px; letter-spacing:0.1em; }
    .done-content p { color:var(--text-sub); margin-bottom:10px; font-size:13px; }

    /* ===== 底部导航 ===== */
    .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:var(--panel-solid); border-top:1px solid var(--border); z-index:100; }
    .bottom-nav::before { content:''; position:absolute; top:-1px; left:0; width:60px; height:1px; background:var(--primary); box-shadow:0 0 6px var(--primary-glow); }
    .nav-item { flex:1; border:none; background:none; padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; color:var(--text-dim); transition:color 0.2s; }
    .nav-item.active { color:var(--primary); }
    .nav-item.active::after { content:''; width:24px; height:1px; background:var(--primary); box-shadow:0 0 6px var(--primary-glow); margin-top:2px; }
    .nav-icon { font-size:18px; }
    .nav-label { font-size:10px; font-weight:400; letter-spacing:0.1em; text-transform:uppercase; }

    /* ===== 收藏按钮 ===== */
    .fav-btn { position:absolute; top:20px; left:20px; width:34px; height:34px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,0 100%); z-index:3; }
    .fav-btn:active { transform:scale(0.92); }
    .fav-btn.active { color:var(--accent); border-color:var(--accent); box-shadow:0 0 8px var(--accent-glow); }

    /* ===== 收藏列表页 ===== */
    .fav-page { padding:20px 16px; }
    .fav-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .fav-header h2 { font-size:16px; font-weight:400; color:var(--text); letter-spacing:0.1em; text-transform:uppercase; }
    .fav-header .fav-count { font-size:12px; color:var(--text-dim); letter-spacing:0.08em; }
    .fav-list { display:flex; flex-direction:column; gap:8px; }
    .fav-item { background:var(--panel); border:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:all 0.2s; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%); }
    .fav-item:active { transform:scale(0.985); border-color:var(--border-active); }
    .fav-item-info { flex:1; }
    .fav-item-word { font-size:15px; font-weight:400; color:var(--text); margin-bottom:2px; letter-spacing:0.03em; }
    .fav-item-meaning { font-size:12px; color:var(--text-sub); }
    .fav-item-emoji { font-size:20px; margin-right:12px; }
    .fav-item-remove { border:none; background:none; color:var(--text-dim); font-size:16px; cursor:pointer; padding:4px 8px; transition:color 0.2s; }
    .fav-item-remove:active { color:var(--danger); }
    .fav-empty { text-align:center; padding:80px 20px; color:var(--text-dim); }
    .fav-empty-icon { font-size:48px; margin-bottom:16px; color:var(--text-dim); }
    .fav-empty p { font-size:13px; letter-spacing:0.05em; }

    /* ===== PC端适配 ===== */
    @media (min-width:481px) {
      .word-card { max-width:420px; margin-left:auto; margin-right:auto; }
      .card-image { height:200px; }
      .card-emoji { font-size:76px; }
      .word-spelling { font-size:30px; }
      .fav-list { max-width:420px; margin:0 auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ========== 板块选择页 ========== -->
    <section id="modulePage" class="page active">
      <div class="module-select">
        <div class="module-header">
          <h1>VOCAB SYSTEM</h1>
          <p>// 选择词库板块</p>
        </div>
        <div class="module-cards">
          <div class="module-card" id="moduleCET6" data-module="cet6">
            <div class="module-icon">🎓</div>
            <h3>六级刷词</h3>
            <p>大学英语六级核心词汇</p>
            <div class="module-meta">
              <span class="module-count" id="cet6Count">3777 词</span>

            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== 顶部栏 ========== -->
    <header class="top-bar" id="topBar" style="display:none">
      <button class="back-btn" id="backBtn">‹</button>
      <div class="logo" id="topLogo">六级刷词</div>
      <div class="top-right">
        <span class="streak-info" id="todayCount">已斩 0</span>
      </div>
    </header>

    <!-- ========== 主内容区 ========== -->
    <main class="main-content" id="mainContent" style="display:none">
      <section id="startPage" class="page active">
        <div class="start-content">
          <div class="start-emoji">◈</div>
          <h2>SYSTEM READY</h2>
          <p>// 点击下方按钮开始刷词，音频将自动播放</p>
          <button class="btn btn-primary btn-large" id="btnStart">开始刷词</button>
        </div>
      </section>

      <section id="wordPage" class="page">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text"><span id="currentIndex">1</span> / <span id="totalCount">3777</span></div>
        <div class="word-card" id="wordCard">
          <div class="card-image" id="cardImage"><span class="card-emoji" id="cardEmoji">🏃</span></div>
          <div class="card-body">
            <button class="fav-btn" id="favBtn" title="收藏">★</button>
            <h1 class="word-spelling" id="wordText">abandon</h1>
            <p class="word-phonetic" id="wordPhonetic">/əˈbændən/</p>
            <p class="word-meaning" id="wordMeaning">vt. 放弃，抛弃</p>
            <button class="audio-btn" id="audioBtn" title="朗读单词"><span>▷</span></button>

              <p class="example-en" id="exampleEn">He abandoned his old car.</p>
              <p class="example-cn" id="exampleCn">他抛弃了那辆旧车。</p>
              <button class="audio-btn-small" id="audioBtnExample">▷ PLAY EXAMPLE</button>
            </div>
          </div>
        </div>
        <div class="action-buttons">
          <button class="btn btn-skip" id="btnSkip">不认识</button>
          <button class="btn btn-mastered" id="btnMastered">斩！</button>
        </div>
      </section>

      <section id="donePage" class="page">
        <div class="done-content">
          <div class="done-emoji">◈</div>
          <h2>MISSION COMPLETE</h2>
          <p>// 你已掌握所有单词，太厉害了</p>
          <button class="btn btn-reset" id="btnReset">重新开始</button>

      </section>

      <section id="favPage" class="page">
        <div class="fav-page">
          <div class="fav-header">
            <h2>FAVORITES</h2>
            <span class="fav-count" id="favCount">0 词</span>
          </div>
          <div class="fav-list" id="favList"></div>
          <div class="fav-empty" id="favEmpty" style="display:none">
            <div class="fav-empty-icon">◇</div>
            <p>// 暂无收藏单词</p>
          </div>
        </div>
      </section>
    </main>

    <!-- ========== 底部导航 ========== -->
    <nav class="bottom-nav" id="bottomNav" style="display:none">
      <button class="nav-item active" id="navHome"><span class="nav-icon">▲</span><span class="nav-label">HOME</span></button>
      <button class="nav-item" id="navWord"><span class="nav-icon">≡</span><span class="nav-label">STUDY</span></button>
      <button class="nav-item" id="navFav"><span class="nav-icon">★</span><span class="nav-label">FAVOR</span></button>
    </nav>
  </div>

  <script>
    // ========================================
    // 一、词库数据（100个完整示例，后续可扩容至4500+）
    // ========================================
    var WORD_LIBRARIES = {
      cet6: [
  {word:"spite",phonetic:"/spaɪt/",meaning:"n. 不顾；恶意；怨恨",example:"I cannot help loving her in spite of her many faults.",exampleCn:"虽然她有许多缺点，但我却情不自禁地爱着她。",emoji:"👎"},

  {word:"luxury",phonetic:"/ˈlʌkʃəri/",meaning:"n. 奢侈，奢华；奢侈品；享受",example:"On the seventh floor, you can find four luxury restaurants.",exampleCn:"在七楼，你可以找到四个豪华餐厅。",emoji:"📝"},
  {word:"accommodate",phonetic:"/əˈkɒmədeɪt/",meaning:"vi. 适应；调解",example:"The motel can accommodate as many as 400 guests.",exampleCn:"汽车旅馆可以接待多达400名客人。",emoji:"📝"},
  {word:"eradicate",phonetic:"/ɪˈrædɪkeɪt/",meaning:"vt. 根除，根绝；消灭",example:"This is a sentence with the word 'eradicate'.",exampleCn:"这是一个包含单词'eradicate'的句子。",emoji:"📝"},
  {word:"tertiary",phonetic:"/ˈtɜːʃəri/",meaning:"n. 第三纪；第三修道会会员；第三级教士",example:"This is a sentence with the word 'tertiary'.",exampleCn:"这是一个包含单词'tertiary'的句子。",emoji:"👨‍🏫"},
  {word:"ranch",phonetic:"/rɑːntʃ/",meaning:"n. 大农场；大牧场",example:"This is a sentence with the word 'ranch'.",exampleCn:"这是一个包含单词'ranch'的句子。",emoji:"📝"},
  {word:"primarily",phonetic:"/praɪˈmerəli/",meaning:"adv. 首先；主要地，根本上",example:"If economic globalization is inevitable, it should primarily serve humanity rather than the interests of trans-national corporations.",exampleCn:"如果全球化无法避免，应该首先为人服务而不是为跨国公司的利益服务。",emoji:"📝"},
  {word:"lotion",phonetic:"/ˈləʊʃn/",meaning:"n. 洗液；洗涤剂",example:"Can you put some suntan lotion on my back?",exampleCn:"你能在我的背上涂些防晒霜吗？",emoji:"📝"},
  {word:"setback",phonetic:"/ˈsetbæk/",meaning:"n. 挫折；退步；逆流",example:"He overcame all sorts of hardship and setbacks to succeed in a solo crossing of Antarctica.",exampleCn:"他克服了种种困难和挫折，终于成功一个人越过了南极洲。",emoji:"📝"},

    var currentModule = null;
    var studyQueue = [];
    var currentQueueIndex = 0;
    var masteredSet = {};
    var speechIdCounter = 0;
    var audioUnlocked = false;

    // ========================================
    // 三、DOM 引用
    // ========================================
    var els = {
      modulePage: document.getElementById('modulePage'),
      moduleCET6: document.getElementById('moduleCET6'),
      moduleSmart: document.getElementById('moduleSmart'),
      cet6Count: document.getElementById('cet6Count'),
      cet6Progress: document.getElementById('cet6Progress'),
      smartCount: document.getElementById('smartCount'),
      topBar: document.getElementById('topBar'),
      topLogo: document.getElementById('topLogo'),
      backBtn: document.getElementById('backBtn'),
      todayCount: document.getElementById('todayCount'),
      mainContent: document.getElementById('mainContent'),
      startPage: document.getElementById('startPage'),
      wordPage: document.getElementById('wordPage'),
      donePage: document.getElementById('donePage'),
      btnStart: document.getElementById('btnStart'),
      wordCard: document.getElementById('wordCard'),
      cardImage: document.getElementById('cardImage'),
      cardEmoji: document.getElementById('cardEmoji'),
      wordText: document.getElementById('wordText'),
      wordPhonetic: document.getElementById('wordPhonetic'),
      wordMeaning: document.getElementById('wordMeaning'),
      exampleEn: document.getElementById('exampleEn'),
      exampleCn: document.getElementById('exampleCn'),
      audioBtn: document.getElementById('audioBtn'),
      audioBtnExample: document.getElementById('audioBtnExample'),
      btnSkip: document.getElementById('btnSkip'),
      btnMastered: document.getElementById('btnMastered'),
      btnReset: document.getElementById('btnReset'),
      currentIndex: document.getElementById('currentIndex'),
      totalCount: document.getElementById('totalCount'),
      progressFill: document.getElementById('progressFill'),
      bottomNav: document.getElementById('bottomNav'),
      navHome: document.getElementById('navHome'),
      navWord: document.getElementById('navWord'),
      navFav: document.getElementById('navFav'),
      favBtn: document.getElementById('favBtn'),
      favList: document.getElementById('favList'),
      favCount: document.getElementById('favCount'),
      favEmpty: document.getElementById('favEmpty')
    };

    // ========================================
    // 四、Fisher-Yates 洗牌算法
    // ========================================
    function fisherYatesShuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = a[i];
        a[i] = a[j];
        a[j] = temp;
      }
      return a;
    }

    // ========================================
    // 五、localStorage 存储管理
    // ========================================
    var Storage = {
      getMastered: function(module) {
        var raw = localStorage.getItem('cet_mastered_' + module);
        return raw ? JSON.parse(raw) : [];
      },
      saveMastered: function(module, mastered) {
        localStorage.setItem('cet_mastered_' + module, JSON.stringify(mastered));
      },
      getFavorites: function() {
        var raw = localStorage.getItem('cet_favorites');
        return raw ? JSON.parse(raw) : [];
      },
      saveFavorites: function(list) {
        localStorage.setItem('cet_favorites', JSON.stringify(list));
      }
    };

    // ========================================
    // 六、收藏管理
    // ========================================
    var favSet = {};

    function loadFavorites() {
      var list = Storage.getFavorites();
      favSet = {};
      list.forEach(function(w) { favSet[w.word] = w; });
    }

    function isFavorited(word) {
      return !!favSet[word];
    }

    function toggleFavorite(wordObj) {
      if (favSet[wordObj.word]) {
        delete favSet[wordObj.word];
      } else {
        favSet[wordObj.word] = {
          word: wordObj.word,
          phonetic: wordObj.phonetic,
          meaning: wordObj.meaning,
          emoji: wordObj.emoji,
          module: currentModule || 'cet6'
        };
      }
      var list = Object.values(favSet);
      Storage.saveFavorites(list);
    }

    function getFavCount() {
      return Object.keys(favSet).length;
    }

    function renderFavList() {
      var list = Storage.getFavorites();
      els.favCount.textContent = list.length + ' 词';
      if (list.length === 0) {
        els.favList.innerHTML = '';
        els.favEmpty.style.display = 'block';
        return;
      }
      els.favEmpty.style.display = 'none';
      var html = '';
      list.forEach(function(item) {
        html += '<div class="fav-item" data-word="' + item.word.replace(/"/g, '&quot;') + '">'
          + '<div class="fav-item-info">'
          + '<div class="fav-item-word">' + item.word + '</div>'
          + '<div class="fav-item-meaning">' + (item.meaning || '') + '</div>'
          + '</div>'
          + '<span class="fav-item-emoji">' + (item.emoji || '') + '</span>'
          + '<button class="fav-item-remove" data-remove="' + item.word.replace(/"/g, '&quot;') + '">×</button>'
          + '</div>';
      });
      els.favList.innerHTML = html;

      els.favList.querySelectorAll('.fav-item-remove').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var word = this.getAttribute('data-remove');
          if (favSet[word]) {
            delete favSet[word];
            Storage.saveFavorites(Object.values(favSet));
          }
          renderFavList();
        });
      });
    }


    // ========================================
    // 七、进入板块
    // ========================================
    function enterModule(moduleKey) {
      currentModule = moduleKey;
      var moduleInfo = getModuleInfo(moduleKey);
      els.topLogo.textContent = moduleInfo.name;
      els.modulePage.classList.remove('active');
      els.modulePage.style.display = 'none';
      els.topBar.style.display = 'flex';
      els.mainContent.style.display = 'block';
      els.bottomNav.style.display = 'flex';
      loadMasteredWords();
      loadFavorites();
      showPage('startPage');
      els.navHome.classList.remove('active');
      els.navWord.classList.add('active');
      els.navFav.classList.remove('active');
    }

    function getModuleInfo(key) {
      var info = {
        cet6: { name: '六级刷词', icon: '🎓' },
        smart: { name: '智能制造词汇', icon: '🤖' }
      };
      return info[key] || { name: '刷词', icon: '' };
    }

    function getCurrentWordList() {
      return WORD_LIBRARIES[currentModule] || [];
    }


    // ========================================
    // 九、已斩单词管理
    // ========================================
    function loadMasteredWords() {
      var list = Storage.getMastered(currentModule);
      masteredSet = {};
      list.forEach(function(w) { masteredSet[w] = true; });
    }

    function saveMasteredWords() {
      var list = Object.keys(masteredSet);
      Storage.saveMastered(currentModule, list);
    }

    function getMasteredCount() {
      return Object.keys(masteredSet).length;
    }

    // ========================================
    // 十、构建乱序学习队列
    // ========================================
    function buildShuffledQueue() {
      var wordList = getCurrentWordList();
      var remaining = wordList.filter(function(w) {
        return !masteredSet[w.word];
      });
      if (remaining.length === 0) {
        studyQueue = [];
        return;
      }
      studyQueue = fisherYatesShuffle(remaining);
      currentQueueIndex = 0;
    }

    // ========================================
    // 十一、Web Speech API 音频管理
    // ========================================
    var SpeechManager = {
      voices: [],
      initialized: false,

      init: function() {
        if (!('speechSynthesis' in window)) return;
        var self = this;
        this.voices = speechSynthesis.getVoices();
        if (typeof speechSynthesis.addEventListener === 'function') {
          speechSynthesis.addEventListener('voiceschanged', function() {
            self.voices = speechSynthesis.getVoices();
            self.initialized = true;
          });
        }
        var attempts = 0;
        var pollTimer = setInterval(function() {
          attempts++;
          self.voices = speechSynthesis.getVoices();
          if (self.voices.length > 0 || attempts > 20) {
            self.initialized = true;
            clearInterval(pollTimer);
          }
        }, 100);
        if (this.voices.length > 0) this.initialized = true;
      },

      unlock: function() {
        if (audioUnlocked) return;
        if (!('speechSynthesis' in window)) return;
        var unlocker = new SpeechSynthesisUtterance('');
        unlocker.volume = 0;
        speechSynthesis.speak(unlocker);
        audioUnlocked = true;
      },

      speak: function(text, lang, callback) {
        if (!('speechSynthesis' in window)) {
          if (callback) callback();
          return;
        }
        speechSynthesis.cancel();
        var myId = ++speechIdCounter;
        var utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang || 'en-US';
        utter.rate = (lang === 'zh-CN') ? 1.0 : 0.85;
        utter.pitch = 1.0;
        utter.volume = 1.0;
        if (this.voices.length > 0) {
          for (var i = 0; i < this.voices.length; i++) {
            if (this.voices[i].lang === utter.lang) {
              utter.voice = this.voices[i];
              break;
            }
          }
        }
        utter.onend = function() {
          if (myId === speechIdCounter && callback) callback();
        };
        utter.onerror = function() {
          if (myId === speechIdCounter && callback) callback();
        };
        speechSynthesis.speak(utter);
      }
    };

    SpeechManager.init();

    // ========================================
    // 十二、"开始刷词"按钮
    // ========================================
    els.btnStart.addEventListener('click', function() {
      SpeechManager.unlock();
      buildShuffledQueue();
      if (studyQueue.length === 0) {
        showPage('donePage');
        return;
      }
      showPage('wordPage');
      els.navWord.classList.add('active');
      els.navHome.classList.remove('active');
      els.navFav.classList.remove('active');
      renderCard();
      setTimeout(autoPlayCurrentWord, 300);
    });

    // ========================================
    // 十二B、收藏按钮
    // ========================================
    els.favBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (studyQueue.length === 0) return;
      var word = studyQueue[currentQueueIndex];
      toggleFavorite(word);
      if (isFavorited(word.word)) {
        els.favBtn.classList.add('active');
      } else {
        els.favBtn.classList.remove('active');
      }
    });

    // ========================================
    // 十三、渲染当前单词卡片
    // ========================================
    function renderCard() {
      if (studyQueue.length === 0) {
        showPage('donePage');
        return;
      }
      if (currentQueueIndex >= studyQueue.length) currentQueueIndex = 0;
      var word = studyQueue[currentQueueIndex];
      var hues = [200, 190, 210, 35, 160, 220, 10, 180];
      var hue = hues[word.word.charCodeAt(0) % hues.length];
      els.cardImage.style.background = 'linear-gradient(135deg, hsl(' + hue + ',35%,18%), hsl(' + (hue + 25) + ',30%,10%))';
      els.cardEmoji.textContent = word.emoji;
      els.wordText.textContent = word.word;
      els.wordPhonetic.textContent = word.phonetic;
      els.wordMeaning.textContent = word.meaning;
      els.exampleEn.textContent = word.example;
      els.exampleCn.textContent = word.exampleCn;
      var totalMastered = getMasteredCount();
      var wordList = getCurrentWordList();
      var progress = (totalMastered / wordList.length) * 100;
      els.progressFill.style.width = progress + '%';
      var globalIndex = -1;
      var wordList = getCurrentWordList();
      for (var i = 0; i < wordList.length; i++) {
        if (wordList[i].word === word.word) { globalIndex = i; break; }
      }
      els.currentIndex.textContent = globalIndex >= 0 ? (globalIndex + 1) : (currentQueueIndex + 1);
      els.totalCount.textContent = getCurrentWordList().length;
      els.todayCount.textContent = '已斩 ' + totalMastered;
      if (isFavorited(word.word)) {
        els.favBtn.classList.add('active');
      } else {
        els.favBtn.classList.remove('active');
      }
    }

    // ========================================
    // 十四、自动播放当前单词音频
    // ========================================
    function autoPlayCurrentWord() {
      if (!audioUnlocked) return;
      if (studyQueue.length === 0) return;
      var word = studyQueue[currentQueueIndex];
      SpeechManager.speak(word.word, 'en-US', null);
    }

    // ========================================
    // 十五、操作按钮事件
    // ========================================
    els.btnMastered.addEventListener('click', function() {
      if (studyQueue.length === 0) return;
      var word = studyQueue[currentQueueIndex];
      if (word && !masteredSet[word.word]) {
        masteredSet[word.word] = true;
        saveMasteredWords();
      }
      animateCardOut('mastered');
      setTimeout(function() {
        currentQueueIndex++;
        if (currentQueueIndex >= studyQueue.length) {
          buildShuffledQueue();
          if (studyQueue.length === 0) {
            showPage('donePage');
            return;
          }
        }
        renderCard();
        animateCardIn();
        setTimeout(autoPlayCurrentWord, 350);
      }, 300);
    });

    els.btnSkip.addEventListener('click', function() {
      if (studyQueue.length === 0) return;
      animateCardOut('skip');
      setTimeout(function() {
        currentQueueIndex++;
        if (currentQueueIndex >= studyQueue.length) currentQueueIndex = 0;
        renderCard();
        animateCardIn();
        setTimeout(autoPlayCurrentWord, 350);
      }, 300);
    });

    els.btnReset.addEventListener('click', function() {
      if (!confirm('确定要重置所有进度吗？已斩记录将全部清除！')) return;
      masteredSet = {};
      saveMasteredWords();
      buildShuffledQueue();
      showPage('wordPage');
      els.navWord.classList.add('active');
      els.navHome.classList.remove('active');
      els.navFav.classList.remove('active');
      renderCard();
      setTimeout(autoPlayCurrentWord, 300);
    });

    // ========================================
    // 十六、手动音频按钮
    // ========================================
    els.audioBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (studyQueue.length === 0) return;
      SpeechManager.unlock();
      var word = studyQueue[currentQueueIndex];
      SpeechManager.speak(word.word, 'en-US', null);
    });

    els.audioBtnExample.addEventListener('click', function(e) {
      e.stopPropagation();
      if (studyQueue.length === 0) return;
      SpeechManager.unlock();
      var word = studyQueue[currentQueueIndex];
      SpeechManager.speak(word.example, 'en-US', null);
    });

    // ========================================
    // 十七、卡片动画
    // ========================================
    function animateCardOut(type) {
      var card = els.wordCard;
      card.style.transition = 'all 0.3s ease';
      if (type === 'mastered') {
        card.style.transform = 'translateX(120%) rotate(15deg)';
        card.style.opacity = '0';
      } else {
        card.style.transform = 'translateX(-120%) rotate(-15deg)';
        card.style.opacity = '0';
      }
    }

    function animateCardIn() {
      var card = els.wordCard;
      card.style.transition = 'none';
      card.style.transform = 'translateY(20px)';
      card.style.opacity = '0';
      setTimeout(function() {
        card.style.transition = 'all 0.35s ease';
        card.style.transform = 'translateX(0) rotate(0)';
        card.style.opacity = '1';
      }, 20);
    }

    // ========================================
    // 十八、页面切换
    // ========================================
    function showPage(pageId) {
      var pages = document.querySelectorAll('.page');
      pages.forEach(function(p) { p.classList.remove('active'); });
      document.getElementById(pageId).classList.add('active');
    }

    els.navHome.addEventListener('click', function() {
      goToModulePage();
    });

    els.navWord.addEventListener('click', function() {
      var wordList = getCurrentWordList();
      if (studyQueue.length === 0 && getMasteredCount() < wordList.length) {
        buildShuffledQueue();
      }
      if (studyQueue.length === 0) {
        showPage('donePage');
      } else {
        showPage('wordPage');
        renderCard();
      }
      els.navWord.classList.add('active');
      els.navHome.classList.remove('active');
      els.navFav.classList.remove('active');
    });

    els.navFav.addEventListener('click', function() {
      renderFavList();
      showPage('favPage');
      els.navFav.classList.add('active');
      els.navWord.classList.remove('active');
      els.navHome.classList.remove('active');
    });

    function goToModulePage() {
      currentModule = null;
      studyQueue = [];
      audioUnlocked = false;
      speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel();
      els.topBar.style.display = 'none';
      els.mainContent.style.display = 'none';
      els.bottomNav.style.display = 'none';
      els.modulePage.style.display = 'block';
      els.modulePage.classList.add('active');
      updateModuleProgress();
    }

    // 返回按钮
    els.backBtn.addEventListener('click', function() {
      goToModulePage();
    });

    // 板块选择事件
    els.moduleCET6.addEventListener('click', function() {
      if (WORD_LIBRARIES.cet6.length === 0) {
        alert('该板块暂无词汇');
        return;
      }
      enterModule('cet6');
    });

    els.moduleSmart.addEventListener('click', function() {
      if (WORD_LIBRARIES.smart.length === 0) {
        alert('智能制造词汇板块即将上线，敬请期待！');
        return;
      }
      enterModule('smart');
    });

    function updateModuleProgress() {
      // 六级
      var cet6Mastered = Storage.getMastered('cet6').length;
      els.cet6Count.textContent = WORD_LIBRARIES.cet6.length + ' 词';
      els.cet6Progress.textContent = '已斩 ' + cet6Mastered + ' 词';
      // 智能制造
      if (WORD_LIBRARIES.smart.length === 0) {
        els.smartCount.textContent = '敬请期待';
      } else {
        var smartMastered = Storage.getMastered('smart').length;
        els.smartCount.textContent = WORD_LIBRARIES.smart.length + ' 词';
        document.querySelector('#moduleSmart .module-progress').textContent = '已斩 ' + smartMastered + ' 词';
      }
    }


    // ========================================
    // 二十、初始化
    // ========================================
    function initApp() {
      updateModuleProgress();
      loadFavorites();
    }

    initApp();
  </script>
</body>
</html>
